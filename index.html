<!-- ========================= -->

<!-- SCROLL PROGRESS BAR -->
<div id="progressBar"></div>

<style>

#progressBar{
position:fixed;
top:0;
left:0;
height:4px;
width:0%;
z-index:99999;
background:linear-gradient(to right,#2563EB,#38BDF8);
box-shadow:0 0 20px #38BDF8;
transition:width 0.15s ease;
}

/* PREMIUM GLOW */

.premium-glow{
position:relative;
overflow:hidden;
}

.premium-glow::before{
content:'';
position:absolute;
width:300px;
height:300px;
background:radial-gradient(circle,rgba(56,189,248,0.18),transparent 70%);
top:-120px;
right:-120px;
pointer-events:none;
}

/* FLOATING BLUR */

.blur-orb{
position:absolute;
border-radius:9999px;
filter:blur(90px);
opacity:0.25;
pointer-events:none;
}

.blur-one{
width:260px;
height:260px;
background:#2563EB;
top:10%;
left:-5%;
animation:float1 10s ease-in-out infinite;
}

.blur-two{
width:220px;
height:220px;
background:#0EA5E9;
bottom:10%;
right:-5%;
animation:float2 12s ease-in-out infinite;
}

@keyframes float1{
0%,100%{transform:translateY(0px);}
50%{transform:translateY(30px);}
}

@keyframes float2{
0%,100%{transform:translateY(0px);}
50%{transform:translateY(-30px);}
}

/* ADVANCED CARD */

.advanced-card{
position:relative;
transition:0.4s ease;
overflow:hidden;
}

.advanced-card:hover{
transform:translateY(-10px) scale(1.01);
border-color:rgba(96,165,250,0.4);
box-shadow:0 20px 60px rgba(37,99,235,0.15);
}

.advanced-card::after{
content:'';
position:absolute;
inset:0;
background:linear-gradient(
135deg,
transparent,
rgba(255,255,255,0.03),
transparent
);
transform:translateX(-100%);
transition:0.7s ease;
}

.advanced-card:hover::after{
transform:translateX(100%);
}

/* EXPERIENCE TIMELINE */

.timeline{
position:relative;
padding-left:40px;
}

.timeline::before{
content:'';
position:absolute;
left:10px;
top:0;
width:2px;
height:100%;
background:rgba(255,255,255,0.08);
}

.timeline-dot{
position:absolute;
left:0;
top:14px;
width:22px;
height:22px;
border-radius:9999px;
background:linear-gradient(to right,#2563EB,#38BDF8);
box-shadow:0 0 20px rgba(56,189,248,0.6);
}

/* SECTION DIVIDER */

.section-divider{
height:1px;
background:linear-gradient(
to right,
transparent,
rgba(255,255,255,0.08),
transparent
);
}

/* REVEAL ANIMATION */

.reveal{
opacity:0;
transform:translateY(60px);
transition:1s ease;
}

.reveal.active{
opacity:1;
transform:translateY(0px);
}

/* PROJECT IMAGE PLACEHOLDER */

.project-preview{
height:180px;
border-radius:20px;
background:
linear-gradient(
135deg,
rgba(37,99,235,0.2),
rgba(14,165,233,0.05)
);
border:1px solid rgba(255,255,255,0.04);
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
letter-spacing:2px;
color:#94A3B8;
margin-bottom:24px;
}

/* PREMIUM BUTTON */

.premium-btn{
position:relative;
overflow:hidden;
}

.premium-btn::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,0.2),
transparent
);
transition:0.7s ease;
}

.premium-btn:hover::before{
left:100%;
}

/* MOBILE MENU */

.mobile-menu{
display:none;
}

@media(max-width:1024px){

.desktop-nav{
display:none;
}

.mobile-menu{
display:flex;
}

}

</style>

<!-- FLOATING ORBS -->
<div class="blur-orb blur-one"></div>
<div class="blur-orb blur-two"></div>

<script>

/* SCROLL PROGRESS */

window.addEventListener('scroll',()=>{

const scrollTop=document.documentElement.scrollTop;
const scrollHeight=document.documentElement.scrollHeight-document.documentElement.clientHeight;

const progress=(scrollTop/scrollHeight)*100;

document.getElementById('progressBar').style.width=progress+'%';

});

/* REVEAL EFFECT */

const reveals=document.querySelectorAll('.reveal');

window.addEventListener('scroll',()=>{

for(let i=0;i<reveals.length;i++){

const windowHeight=window.innerHeight;
const revealTop=reveals[i].getBoundingClientRect().top;
const revealPoint=120;

if(revealTop<windowHeight-revealPoint){
reveals[i].classList.add('active');
}

}

});

</script>
